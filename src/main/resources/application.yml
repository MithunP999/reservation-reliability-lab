management:
  endpoints:
    web:
      exposure:
        include: health
booking:
  hold-duration: 10m
gateway:
  # Fictional local default; real deployments override it.
  base-url: http://localhost:8089
spring:
  jackson:
    deserialization:
      # Money is whole minor units: reject 10.9 instead of silently cutting it to 10.
      accept-float-as-int: false
